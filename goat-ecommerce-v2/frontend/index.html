<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ===== SEO BASICO ===== -->
  <title>GOAT Studios</title>
  <meta name="description"
    content="GOAT Studios es una tienda de moda urbana colombiana. Descubre colecciones exclusivas de ropa y accesorios con identidad, estilo y diseno contemporaneo." />
  <meta name="keywords"
    content="GOAT Studios, moda urbana Colombia, ropa streetwear, colecciones urbanas, tienda online ropa Colombia, moda contemporanea" />
  <meta name="author" content="GOAT Studios" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://www.goatstudios.co/" />

  <!-- ===== OPEN GRAPH (Facebook, WhatsApp, LinkedIn) ===== -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="GOAT Studios" />
  <meta property="og:title" content="GOAT Studios | Moda Urbana Colombiana" />
  <meta property="og:description"
    content="GOAT Studios es una tienda de moda urbana colombiana. Descubre colecciones exclusivas de ropa y accesorios con identidad, estilo y diseno contemporaneo." />
  <meta property="og:url" content="https://www.goatstudios.co/" />
  <meta property="og:image" content="https://www.goatstudios.co/images/og-cover.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="es_CO" />

  <!-- ===== TWITTER CARD ===== -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="GOAT Studios | Moda Urbana Colombiana" />
  <meta name="twitter:description"
    content="Descubre colecciones exclusivas de moda urbana colombiana. Ropa y accesorios con identidad y diseno contemporaneo." />
  <meta name="twitter:image" content="https://www.goatstudios.co/images/og-cover.jpg" />

  <!-- ===== TEMA Y FAVICON ===== -->
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <!-- ===== DATOS ESTRUCTURADOS JSON-LD (Google Rich Results) ===== -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ClothingStore",
      "name": "GOAT Studios",
      "url": "https://www.goatstudios.co",
      "logo": "https://www.goatstudios.co/images/logo.png",
      "image": "https://www.goatstudios.co/images/og-cover.jpg",
      "description": "GOAT Studios es una tienda de moda urbana colombiana con colecciones exclusivas de ropa y accesorios contemporaneos.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "CO"
      },
      "sameAs": [
        "https://www.instagram.com/goatstudios",
        "https://www.tiktok.com/@goatstudios"
      ],
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.goatstudios.co/shop?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

  <!-- ===== FUENTES ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
